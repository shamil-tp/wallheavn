<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaroid Wallpaper Camera</title>
    
    <!-- Importing specific fonts for the editorial/analog feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           VARIABLES & RESET
           ========================================================= */
        :root {
            --bg-color: #e4e2dd;
            --text-main: #2b2b2b;
            --text-muted: #6b6b6b;
            --polaroid-white: #f9f9f9;
            --accent-red: #c2413a;
            --shadow-color: rgba(0, 0, 0, 0.12);
            --font-mono: 'Space Mono', ui-monospace, SFMono-Regular, monospace;
            --font-handwriting: 'Caveat', cursive;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle paper grain texture overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 50;
        }

        /* =========================================================
           LAYOUT & TYPOGRAPHY
           ========================================================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 1.5rem 2rem;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            z-index: 10;
        }

        .brand-name {
            font-weight: 700;
        }
        
        .brand-name span {
            color: var(--text-muted);
            font-weight: 400;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-main);
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }
        .status-dot.active { background-color: var(--accent-red); }
        .status-dot.developing { background-color: #e09f3e; }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            perspective: 1000px;
        }

        /* =========================================================
           THE POLAROID
           ========================================================= */
        .polaroid-wrapper {
            position: relative;
            z-index: 5;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .polaroid {
            background: var(--polaroid-white);
            padding: clamp(12px, 2vw, 20px);
            padding-bottom: clamp(60px, 8vw, 90px);
            box-shadow: 
                0 20px 40px -10px var(--shadow-color),
                0 1px 3px rgba(0,0,0,0.05),
                inset 0 0 0 1px rgba(0,0,0,0.02);
            /* Instax wide ratio roughly */
            width: clamp(280px, 80vw, 600px);
            position: relative;
            transform-origin: center center;
        }

        .photo-area {
            background-color: #1a1a1a;
            width: 100%;
            aspect-ratio: 16 / 9; /* Wallpapers are mostly landscape */
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
        }

        .photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0; /* Starts hidden before developing */
        }

        /* The chemical development layer */
        .developing-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            pointer-events: none;
            mix-blend-mode: normal;
            transition: opacity 2s ease-in-out;
        }

        .polaroid-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: clamp(60px, 8vw, 90px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 clamp(12px, 2vw, 20px);
        }

        .caption {
            font-family: var(--font-handwriting);
            font-size: clamp(1.5rem, 3vw, 2rem);
            color: #111;
            transform: rotate(-2deg);
        }

        .metadata {
            font-size: 0.6rem;
            color: #999;
            text-align: right;
            line-height: 1.4;
            text-transform: uppercase;
        }

        /* =========================================================
           CONTROLS / CAMERA UI
           ========================================================= */
        footer.controls {
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1rem;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group.right {
            align-items: flex-end;
            text-align: right;
        }

        .label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .data-value {
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-main);
        }
        
        a.data-value:hover {
            text-decoration: underline;
        }

        /* The Shutter Button */
        .shutter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .shutter-btn {
            background: #2b2b2b;
            border: 4px solid #1a1a1a;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            outline: none;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 6px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(255,255,255,0.1);
        }

        .shutter-btn::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            transition: background-color 0.2s;
        }

        .shutter-btn:hover {
            transform: scale(1.05);
        }

        .shutter-btn:active {
            transform: scale(0.95);
        }

        .shutter-btn:disabled {
            cursor: not-allowed;
            transform: scale(1);
        }
        
        .shutter-btn:disabled::after {
            background-color: #555;
        }

        .action-link {
            background: none;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            font-family: inherit;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .action-link:hover {
            background: var(--text-main);
            color: var(--bg-color);
        }

        /* =========================================================
           ANIMATIONS
           ========================================================= */
        @media (prefers-reduced-motion: no-preference) {
            .anim-eject {
                animation: ejectPhoto 0.8s cubic-bezier(0.2, 1, 0.3, 1) forwards;
            }
            
            .anim-develop img {
                animation: developImage 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            }
        }

        @keyframes ejectPhoto {
            0% { transform: translateY(-30px) scale(0.95); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes developImage {
            0% { opacity: 0; filter: sepia(0.8) brightness(0.4) contrast(1.2); }
            40% { opacity: 0.6; filter: sepia(0.3) brightness(0.8) contrast(1.1); }
            100% { opacity: 1; filter: sepia(0) brightness(1) contrast(1); }
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */
        @media (max-width: 768px) {
            footer.controls {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
            }
            .shutter-container {
                grid-column: 1 / -1;
                grid-row: 1;
                margin-bottom: 1rem;
            }
            .control-group.right {
                align-items: flex-start;
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">LUMEN <span>INSTANT</span></div>
        <div class="status">
            <span id="status-text">READY</span>
            <div id="status-dot" class="status-dot"></div>
        </div>
    </header>

    <main>
        <div id="polaroid-wrapper" class="polaroid-wrapper">
            <div id="polaroid" class="polaroid">
                <div class="photo-area">
                    <img id="photo-img" src="" alt="Instant photograph" />
                    <div id="developing-layer" class="developing-layer"></div>
                </div>
                <div class="polaroid-footer">
                    <div id="caption" class="caption">#000</div>
                    <div class="metadata">
                        <span id="meta-res">0x0</span><br>
                        <span id="meta-id">ID: ----</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="controls">
        <div class="control-group">
            <span class="label">EXP. COUNTER</span>
            <span id="counter" class="data-value">000</span>
        </div>

        <div class="shutter-container">
            <button id="shutter-btn" class="shutter-btn" aria-label="Take Photo"></button>
            <span class="label">SHUTTER</span>
        </div>

        <div class="control-group right">
            <span class="label">ORIGINAL SRC</span>
            <a id="source-link" href="#" target="_blank" class="data-value" style="margin-bottom: 0.5rem;">VIEW WALLHAVEN</a>
            <a id="download-btn" href="#" class="action-link" target="_blank">SAVE PRINT</a>
        </div>
    </footer>

    <script>
    /* =========================================================
       CONFIGURATION
       ========================================================= */
    const API_BASE_URL = "https://wallheaven.shamiltp.me";

    /* =========================================================
       STATE & DOM ELEMENTS
       ========================================================= */
    let state = {
        isFetching: false,
        photoCount: 0,
        currentPhotoUrl: null
    };

    const DOM = {
        shutterBtn: document.getElementById('shutter-btn'),
        statusText: document.getElementById('status-text'),
        statusDot: document.getElementById('status-dot'),
        polaroidWrapper: document.getElementById('polaroid-wrapper'),
        polaroid: document.getElementById('polaroid'),
        photoImg: document.getElementById('photo-img'),
        devLayer: document.getElementById('developing-layer'),
        caption: document.getElementById('caption'),
        metaRes: document.getElementById('meta-res'),
        metaId: document.getElementById('meta-id'),
        counter: document.getElementById('counter'),
        sourceLink: document.getElementById('source-link'),
        downloadBtn: document.getElementById('download-btn')
    };

    /* =========================================================
       LOGIC & INTERACTIONS
       ========================================================= */
    function applyRandomRotation() {
        const min = -3;
        const max = 3;
        const randomDeg = Math.random() * (max - min) + min;
        DOM.polaroid.style.transform = `rotate(${randomDeg.toFixed(1)}deg)`;
    }

    function updateStatus(text, mode = 'normal') {
        DOM.statusText.textContent = text;
        DOM.statusDot.className = 'status-dot';
        if (mode === 'active') DOM.statusDot.classList.add('active');
        if (mode === 'developing') DOM.statusDot.classList.add('developing');
    }

    async function fetchRandomWallpaper() {
        if (state.isFetching) return;
        
        state.isFetching = true;
        DOM.shutterBtn.disabled = true;
        updateStatus('EXPOSING...', 'active');

        try {
            const url = new URL(API_BASE_URL);
            url.searchParams.append('sorting', 'random');
            url.searchParams.append('purity', '100'); // SFW only

            const response = await fetch(url);
            
            if (response.status === 429) {
                throw new Error("Rate limit exceeded. Please try again later.");
            }
            if (!response.ok) {
                throw new Error(`API Error: ${response.status}`);
            }

            const json = await response.json();

            if (!json.data || json.data.length === 0) {
                throw new Error("No photographs found.");
            }

            const photoData = json.data[0];
            processPhotograph(photoData);

        } catch (error) {
            console.error(error);
            updateStatus('ERROR', 'active');
            alert(error.message);
            resetCameraReady();
        }
    }

    function processPhotograph(photoData) {
        updateStatus('DEVELOPING...', 'developing');
        
        const img = new Image();
        img.onload = () => {
            revealPhotograph(photoData);
        };
        img.onerror = () => {
            updateStatus('FILM JAMMED', 'active');
            resetCameraReady();
        };
        img.src = photoData.path;
    }

    function revealPhotograph(data) {
        state.photoCount++;
        state.currentPhotoUrl = data.path;
        
        DOM.polaroidWrapper.classList.remove('anim-eject');
        DOM.photoImg.parentElement.classList.remove('anim-develop');
        
        void DOM.polaroidWrapper.offsetWidth;

        DOM.photoImg.src = data.path;
        DOM.caption.textContent = `#${String(state.photoCount).padStart(3, '0')}`;
        DOM.metaRes.textContent = `${data.resolution}`;
        DOM.metaId.textContent = `ID: ${data.id}`;
        DOM.counter.textContent = String(state.photoCount).padStart(3, '0');
        
        DOM.sourceLink.href = data.short_url || data.url;
        
        DOM.downloadBtn.href = data.path;
        DOM.downloadBtn.onclick = async (e) => {
            e.preventDefault();
            try {
                const response = await fetch(data.path);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const tempLink = document.createElement('a');
                tempLink.href = blobUrl;
                tempLink.download = `wallhaven-${data.id}.jpg`;
                document.body.appendChild(tempLink);
                tempLink.click();
                tempLink.remove();
                URL.revokeObjectURL(blobUrl);
            } catch (err) {
                window.open(data.path, '_blank');
            }
        };

        applyRandomRotation();
        DOM.devLayer.style.opacity = '1';
        
        DOM.polaroidWrapper.classList.add('anim-eject');
        
        setTimeout(() => {
            DOM.devLayer.style.opacity = '0';
            DOM.photoImg.parentElement.classList.add('anim-develop');
        }, 300);

        setTimeout(() => {
            resetCameraReady();
        }, 3000);
    }

    function resetCameraReady() {
        state.isFetching = false;
        DOM.shutterBtn.disabled = false;
        updateStatus('READY');
    }

    /* =========================================================
       EVENT LISTENERS
       ========================================================= */
    DOM.shutterBtn.addEventListener('click', fetchRandomWallpaper);

    document.addEventListener('keydown', (e) => {
        if ((e.code === 'Space' || e.code === 'Enter') && !state.isFetching) {
            if(e.code === 'Space') e.preventDefault(); 
            fetchRandomWallpaper();
        }
    });

    applyRandomRotation();
</script>
</body>
</html>
